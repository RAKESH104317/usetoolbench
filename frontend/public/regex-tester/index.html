<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regex Tester | USETOOLBENCH</title><meta name="description" content="Free privacy-first regular expression tester. Test patterns in your browser."><link rel="canonical" href="https://usetoolbench.in/regex-tester/"><style>body{font:16px system-ui,sans-serif;background:#f4f7fb;color:#17243a;margin:0}main{max-width:800px;margin:30px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin-top:16px;font-weight:600}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;font:inherit;border:1px solid #bac5d5;border-radius:8px}button{margin-top:18px;background:#244c8e;color:white;border:0;padding:12px 20px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f8;padding:16px;border-radius:8px}a{color:#244c8e}@media(max-width:600px){main{margin:8px;padding:16px}}</style></head><body><main><nav><a href="/">Home</a> / <a href="/tools/">Tools</a></nav><h1>Regex Tester</h1><p>Test regular expressions locally. Your text never leaves your browser.</p><label for="pattern">Pattern</label><input id="pattern" placeholder="Enter a regular expression"><label for="flags">Flags</label><input id="flags" value="gi" maxlength="8"><label for="source">Test text</label><textarea id="source" rows="8"></textarea><button id="run" type="button">Find matches</button><pre id="output" aria-live="polite">Results appear here.</pre></main><script>document.getElementById('run').addEventListener('click',()=>{const o=document.getElementById('output');try{const p=document.getElementById('pattern').value,f=document.getElementById('flags').value,s=document.getElementById('source').value;if(!p)throw Error('Enter a pattern.');if(/[^dgimsuvy]/.test(f)||new Set(f).size!==f.length)throw Error('Invalid or duplicate flags.');const r=new RegExp(p,f.includes('g')?f:f+'g'),m=[...s.matchAll(r)].slice(0,500);o.textContent=m.length+' matches'+(m.length?'\n'+m.map((x,i)=>(i+1)+': '+JSON.stringify(x[0])+' at index '+x.index).join('\n'):'');}catch(e){o.textContent='Error: '+e.message}})</script></body></html>
