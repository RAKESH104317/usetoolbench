<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Diff Checker | USETOOLBENCH</title><meta name="description" content="Compare text locally, line by line, with no upload."><link rel="canonical" href="https://usetoolbench.in/text-diff-checker/"><style>body{font:16px system-ui,sans-serif;background:#f4f7fb;color:#17243a;margin:0}main{max-width:850px;margin:30px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin-top:16px;font-weight:600}textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;font:inherit;border:1px solid #bac5d5;border-radius:8px}button{margin-top:18px;background:#244c8e;color:white;border:0;padding:12px 20px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f8;padding:16px;border-radius:8px}a{color:#244c8e}@media(max-width:600px){main{margin:8px;padding:16px}}</style></head><body><main><nav><a href="/">Home</a> / <a href="/tools/">Tools</a></nav><h1>Text Difference Checker</h1><p>Compare original and updated text line by line. No upload or external API.</p><label for="original">Original</label><textarea id="original" rows="7"></textarea><label for="updated">Updated</label><textarea id="updated" rows="7"></textarea><button id="compare" type="button">Compare</button><pre id="result" aria-live="polite">Differences appear here.</pre></main><script>document.getElementById('compare').addEventListener('click',()=>{const a=document.getElementById('original').value.split('\n'),b=document.getElementById('updated').value.split('\n'),lines=[];for(let i=0;i<Math.max(a.length,b.length);i++){if(a[i]===b[i])continue;if(i<a.length)lines.push('- Line '+(i+1)+': '+a[i]);if(i<b.length)lines.push('+ Line '+(i+1)+': '+b[i]);if(lines.length>=1000){lines.push('Output limited to 1000 lines.');break}}document.getElementById('result').textContent=lines.length?lines.join('\n'):'No line differences.'})</script></body></html>
