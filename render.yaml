services:
  - type: web
    name: usetoolbench-deals
    runtime: node
    plan: free
    region: singapore
    branch: fresh-rebuild
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usetoolbench-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production

      - key: AI_ENABLED
        value: 'true'
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash:cheapest

databases:
  - name: usetoolbench-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
