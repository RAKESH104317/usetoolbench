services:
  - type: web
    name: usetoolbench-deals
    runtime: node
    plan: free
    region: singapore
    branch: fresh-rebuild
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
