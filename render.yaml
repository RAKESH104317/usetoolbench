services:
  - type: web
    name: usetoolbench
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: STORAGE_ROOT
        value: ./storage
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: FILE_RETENTION_MINUTES
        value: 60
