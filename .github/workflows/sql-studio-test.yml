name: SQL Studio integration test
on:
  push:
    branches: [fresh-rebuild]
    paths: ['sql-studio/**', '.github/workflows/sql-studio-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and start isolated SQL Server Express
        working-directory: sql-studio
        run: |
          password="Aa1!$(openssl rand -hex 20)"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          MSSQL_SA_PASSWORD="$password" docker compose pull
          MSSQL_SA_PASSWORD="$password" docker compose up -d
      - name: Run actual T-SQL tests
        working-directory: sql-studio
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 3
          done
          docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b < seed.sql
          docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b < verify.sql
      - name: Cleanup
        if: always()
        working-directory: sql-studio
        run: docker compose down -v
