name: Refresh product discounts
on:
  push:
    branches: [fresh-rebuild]
    paths: [".github/workflows/auto-publish-coupons.yml"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: deal-feed-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh qualifying product offers
        run: |
          if [[ -z "$SITE_API_URL" || -z "$ADMIN_TOKEN" || ( -z "$DEAL_FEED_URL" && -z "$DEAL_FEEDS_JSON" ) ]]; then
            echo "::warning::Discount refresh skipped: configure SITE_API_URL, ADMIN_TOKEN and an approved deal feed."
            echo "Discount refresh NOT RUN: required configuration missing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/auto-publish-coupons.js
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DEAL_FEED_URL: ${{ secrets.DEAL_FEED_URL }}
          DEAL_FEEDS_JSON: ${{ secrets.DEAL_FEEDS_JSON }}
