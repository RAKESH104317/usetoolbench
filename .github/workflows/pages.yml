name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, fresh-rebuild, 'fix/**']
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test
      - name: Fetch daily INR reference rates
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          try {
            const response=await fetch('https://api.frankfurter.dev/v2/rates?base=INR',{signal:AbortSignal.timeout(25000)});
            if(!response.ok)throw Error('Rate source HTTP '+response.status);
            const rows=await response.json();
            const rates={},dates={};
            for(const row of rows){if(/^[A-Z]{3}$/.test(row.quote)&&Number.isFinite(row.rate)&&row.rate>0&&row.date){rates[row.quote]=1/row.rate;dates[row.quote]=row.date;}} if(Object.keys(rates).length<30)throw Error('Incomplete currency feed');rates.INR=1;
            fs.writeFileSync('frontend/public/exchange-rates.json',JSON.stringify({date:[...new Set(Object.values(dates))].sort().join(' / '),dates,updatedAt:new Date().toISOString(),rates,source:'Frankfurter reference rates'}));
          } catch(e) {
            console.warn(e.message);
            const old=await fetch('https://usetoolbench.in/exchange-rates.json',{signal:AbortSignal.timeout(15000)}).then(r=>r.ok?r.json():null).catch(()=>null);
            if(old?.rates&&old?.date)fs.writeFileSync('frontend/public/exchange-rates.json',JSON.stringify(old));
            else console.warn('No prior rates available; header will show unavailable.');
          }
          JS
      - run: npm run build --prefix frontend
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - name: Package PDF editor libraries locally
        run: |
          npm install --prefix frontend --no-save --package-lock=false pdf-lib@1.17.1 pdfjs-dist@4.10.38
          mkdir -p frontend/dist/pdf-vendor
          cp frontend/node_modules/pdfjs-dist/legacy/build/pdf.mjs frontend/dist/pdf-vendor/
          cp frontend/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs frontend/dist/pdf-vendor/
          cp frontend/node_modules/pdf-lib/dist/pdf-lib.esm.min.js frontend/dist/pdf-vendor/pdf-lib.mjs
          sed -i 's|https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm|/pdf-vendor/pdf-lib.mjs|g; s|https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/|/pdf-vendor/|g' frontend/dist/pdf-editor.mjs
          node --check frontend/dist/pdf-editor.mjs
          test -s frontend/dist/pdf-vendor/pdf.worker.mjs
      - name: Browser smoke test PDF editing and download
        run: |
          npm install --prefix frontend --no-save --package-lock=false playwright pdf-lib@1.17.1 pdfjs-dist@4.10.38
          cd frontend
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory dist >/tmp/pdf-http.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { PDFDocument } from 'pdf-lib';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,acceptDownloads:true});
            page.on('pageerror',e=>console.log('PAGE ERROR',e.message));
            page.on('console',m=>console.log('BROWSER',m.text()));
            await page.route('**/api/pdf/allowance',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({remaining:4}),headers:{'access-control-allow-origin':'*','access-control-allow-methods':'POST, OPTIONS','access-control-allow-headers':'content-type'}}));
            const doc=await PDFDocument.create();doc.addPage([595,842]).drawText('Original sample',{x:60,y:750});
            await page.goto('http://localhost:8765/edit-pdf/');
            await page.waitForFunction(()=>typeof document.querySelector('#upload')?.onchange==='function');
            await page.locator('#upload').setInputFiles({name:'sample.pdf',mimeType:'application/pdf',buffer:Buffer.from(await doc.save())});
            await page.waitForFunction(()=>!document.querySelector('#workspace').hidden && document.querySelector('#counter').textContent.trim()==='1 / 1' && document.querySelector('#preview').width>300,{},{timeout:30000}).catch(async e=>{console.log('EDITOR STATUS',await page.locator('#quota').textContent(),await page.locator('#status').textContent());throw e});
            assert.equal(await page.locator('#mode').inputValue(),'select');
            assert.equal(await page.locator('#drop').isHidden(),true);
            await page.getByRole('button',{name:'Edit Original sample',exact:true}).tap();
            const inline=page.getByRole('textbox',{name:'Edit PDF text',exact:true});
            await inline.fill('Edited sample');
            await inline.press('Enter');
            const download=page.waitForEvent('download');
            await page.locator('#save').click();
            const file=await download;
            const path=await file.path();
            const fs=await import('node:fs/promises');
            const result=await PDFDocument.load(await fs.readFile(path));
            assert.equal(result.getPageCount(),1);
            assert.ok((await fs.stat(path)).size>0);
            const pdfjs=await import('pdfjs-dist/legacy/build/pdf.mjs');
            const parsed=await pdfjs.getDocument({data:new Uint8Array(await fs.readFile(path)),useSystemFonts:true}).promise;
            const text=(await (await parsed.getPage(1)).getTextContent()).items.map(i=>i.str).join(' ');
            assert.ok(text.includes('Edited sample'),text);
            assert.ok(!text.includes('Original sample'), 'Original text must be removed: '+text);
            console.log('Mobile PDF upload, direct existing-text editing and download passed');
          } finally {await browser.close()}
          JS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
