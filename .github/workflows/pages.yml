name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, fresh-rebuild, 'fix/**']
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test
      - name: Fetch daily INR reference rates
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          try {
            const response=await fetch('https://api.frankfurter.dev/v2/rates?base=INR',{signal:AbortSignal.timeout(25000)});
            if(!response.ok)throw Error('Rate source HTTP '+response.status);
            const rows=await response.json();
            const rates={},dates={};
            for(const row of rows){if(/^[A-Z]{3}$/.test(row.quote)&&Number.isFinite(row.rate)&&row.rate>0&&row.date){rates[row.quote]=1/row.rate;dates[row.quote]=row.date;}} if(Object.keys(rates).length<30)throw Error('Incomplete currency feed');rates.INR=1;
            fs.writeFileSync('frontend/public/exchange-rates.json',JSON.stringify({date:[...new Set(Object.values(dates))].sort().join(' / '),dates,updatedAt:new Date().toISOString(),rates,source:'Frankfurter reference rates'}));
          } catch(e) {
            console.warn(e.message);
            const old=await fetch('https://usetoolbench.in/exchange-rates.json',{signal:AbortSignal.timeout(15000)}).then(r=>r.ok?r.json():null).catch(()=>null);
            if(old?.rates&&old?.date)fs.writeFileSync('frontend/public/exchange-rates.json',JSON.stringify(old));
            else console.warn('No prior rates available; header will show unavailable.');
          }
          JS
      - run: npm run build --prefix frontend
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - name: Package PDF editor libraries locally
        run: |
          npm install --prefix frontend --no-save --package-lock=false pdf-lib@1.17.1 pdfjs-dist@4.10.38
          mkdir -p frontend/dist/pdf-vendor
          cp frontend/node_modules/pdfjs-dist/legacy/build/pdf.mjs frontend/dist/pdf-vendor/
          cp frontend/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs frontend/dist/pdf-vendor/
          cp frontend/node_modules/pdf-lib/dist/pdf-lib.esm.min.js frontend/dist/pdf-vendor/pdf-lib.mjs
          sed -i 's|https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm|/pdf-vendor/pdf-lib.mjs|g; s|https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/|/pdf-vendor/|g' frontend/dist/pdf-editor.mjs
          node --check frontend/dist/pdf-editor.mjs
          test -s frontend/dist/pdf-vendor/pdf.worker.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
