services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong local password}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - practice-data:/var/opt/mssql
volumes:
  practice-data:
